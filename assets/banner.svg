<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="40%" stop-color="#0f172a"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="cardGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".65"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".4"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(-15px,20px);opacity:.55}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(12px)}}@keyframes wavePath{0%{stroke-dashoffset:0}}@keyframes blinkDot{0%{opacity:.2}50%{opacity:1}}.font-sub,.font-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.font-title{font-weight:800}.font-sub{font-weight:500}.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite 3s;transform-origin:1000px 250px}.float-card-1{animation:floatPill1 6s ease-in-out infinite}.float-card-2{animation:floatPill2 7s ease-in-out infinite 1s}.float-card-3{animation:floatPill1 5s ease-in-out infinite 2s}.animated-wire{stroke-dasharray:12,12;animation:wavePath 25s linear infinite}.dot-1{animation:blinkDot 2s ease-in-out infinite}.dot-2{animation:blinkDot 2s ease-in-out infinite .7s}.dot-3{animation:blinkDot 2s ease-in-out infinite 1.4s}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g id="dynamic-bg"><circle cx="220" cy="110" r="140" fill="#6366f1" class="orb-1" filter="url(#glow)" opacity=".3"/><circle cx="980" cy="220" r="160" fill="#a855f7" class="orb-2" filter="url(#glow)" opacity=".25"/><circle cx="600" cy="50" r="100" fill="#ec4899" filter="url(#glow)" opacity=".15"/><path fill="none" stroke="#475569" stroke-width="1.8" d="M 50 280 C 250 320, 350 200, 600 240 C 850 280, 950 160, 1150 220" class="animated-wire" opacity=".35"/><path fill="none" stroke="#6366f1" stroke-width="1.5" d="M 80 100 C 300 60, 450 160, 700 110 C 900 70, 1020 150, 1120 120" class="animated-wire" opacity=".25"/><g class="float-card-1" transform="translate(60, 180)"><rect width="140" height="36" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="5" fill="#38bdf8" class="dot-1"/><text x="35" y="23" fill="#94a3b8" class="font-mono" font-size="12">Multi-Model</text></g><g class="float-card-2" transform="translate(990, 70)"><rect width="145" height="36" fill="url(#cardGrad1)" stroke="#a855f7" stroke-opacity=".3" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="5" fill="#a855f7" class="dot-2"/><text x="35" y="23" fill="#cbd5e1" class="font-mono" font-size="12">Self-Hosted UI</text></g><g class="float-card-3" transform="translate(970, 260)"><rect width="155" height="36" fill="url(#cardGrad1)" stroke="#ec4899" stroke-opacity=".3" stroke-width="1" rx="18"/><circle cx="20" cy="18" r="5" fill="#ec4899" class="dot-3"/><text x="35" y="23" fill="#cbd5e1" class="font-mono" font-size="12">Enterprise RAG</text></g><g class="float-card-2" transform="translate(80, 275)"><rect width="130" height="34" fill="url(#cardGrad1)" stroke="#10b981" stroke-opacity=".3" stroke-width="1" rx="17"/><circle cx="18" cy="17" r="4.5" fill="#10b981" class="dot-3"/><text x="32" y="22" fill="#94a3b8" class="font-mono" font-size="12">Open-Source</text></g></g><g id="foreground-content"><g transform="translate(600, 72)"><rect width="280" height="32" x="-140" y="-16" fill="#1e1b4b" stroke="#6366f1" stroke-opacity=".6" stroke-width="1.2" rx="16"/><text y="5" fill="#a5b4fc" class="font-mono" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">⚡ CURATED ECOSYSTEM ⚡</text></g><text x="600" y="160" fill="url(#primaryGrad)" class="font-title" font-size="52" letter-spacing="-.5" text-anchor="middle">Awesome AI Chat Interface</text><text x="600" y="215" fill="#f8fafc" class="font-sub" font-size="20" letter-spacing=".2" text-anchor="middle">The Definitive Guide to Modern AI Conversational Frontends</text><text x="600" y="255" fill="#94a3b8" class="font-mono" font-size="14" text-anchor="middle">SaaS Category Leaders • Self-Hosted &amp; Local WebUIs • Enterprise Copilots • Open-Source</text><g transform="translate(600, 310)"><rect width="370" height="28" x="-185" y="-14" fill="#0f172a" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="14"/><circle cx="-160" cy="0" r="4" fill="#22c55e"/><text x="-145" y="4.5" fill="#64748b" class="font-mono" font-size="11.5">Updated October 2026 • Curated with Community</text></g></g></svg>