<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtitle Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Animated background elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 20px); opacity: 0.55; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes wavePath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 3s; transform-origin: 1000px 250px; }
    .float-card-1 { animation: floatPill1 6s ease-in-out infinite; }
    .float-card-2 { animation: floatPill2 7s ease-in-out infinite 1s; }
    .float-card-3 { animation: floatPill1 5s ease-in-out infinite 2s; }
    .animated-wire { stroke-dasharray: 12, 12; animation: wavePath 25s linear infinite; }
    .dot-1 { animation: blinkDot 2s ease-in-out infinite; }
    .dot-2 { animation: blinkDot 2s ease-in-out infinite 0.7s; }
    .dot-3 { animation: blinkDot 2s ease-in-out infinite 1.4s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Behind Text) -->
  <g id="dynamic-bg">
    <!-- Glowing orbs -->
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
    <circle class="orb-2" cx="980" cy="220" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.25" />
    <circle cx="600" cy="50" r="100" fill="#ec4899" filter="url(#glow)" opacity="0.15" />

    <!-- Connecting animated circuit / flow lines (background) -->
    <path class="animated-wire" d="M 50 280 C 250 320, 350 200, 600 240 C 850 280, 950 160, 1150 220" fill="none" stroke="#475569" stroke-width="1.8" opacity="0.35" />
    <path class="animated-wire" d="M 80 100 C 300 60, 450 160, 700 110 C 900 70, 1020 150, 1120 120" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.25" />

    <!-- Left Floating Mini Pill (Behind Header Margin) -->
    <g class="float-card-1" transform="translate(60, 180)">
      <rect width="140" height="36" rx="18" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="18" r="5" fill="#38bdf8" class="dot-1" />
      <text x="35" y="23" fill="#94a3b8" class="font-mono" font-size="12">Multi-Model</text>
    </g>

    <!-- Right Floating Mini Pill (Top Right) -->
    <g class="float-card-2" transform="translate(990, 70)">
      <rect width="145" height="36" rx="18" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="18" r="5" fill="#a855f7" class="dot-2" />
      <text x="35" y="23" fill="#cbd5e1" class="font-mono" font-size="12">Self-Hosted UI</text>
    </g>

    <!-- Right Floating Mini Pill (Bottom Right) -->
    <g class="float-card-3" transform="translate(970, 260)">
      <rect width="155" height="36" rx="18" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="18" r="5" fill="#ec4899" class="dot-3" />
      <text x="35" y="23" fill="#cbd5e1" class="font-mono" font-size="12">Enterprise RAG</text>
    </g>

    <!-- Bottom Left Floating Pill -->
    <g class="float-card-2" transform="translate(80, 275)">
      <rect width="130" height="34" rx="17" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="18" cy="17" r="4.5" fill="#10b981" class="dot-3" />
      <text x="32" y="22" fill="#94a3b8" class="font-mono" font-size="12">Open-Source</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT & BRANDING (Always high contrast & visible) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
      <text text-anchor="middle" y="5" fill="#a5b4fc" class="font-mono" font-size="13" font-weight="600" letter-spacing="1.5">⚡ CURATED ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text class="font-title" x="600" y="160" text-anchor="middle" font-size="52" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome AI Chat Interface
    </text>

    <!-- Subtitle Line 1 -->
    <text class="font-sub" x="600" y="215" text-anchor="middle" font-size="20" fill="#f8fafc" letter-spacing="0.2">
      The Definitive Guide to Modern AI Conversational Frontends
    </text>

    <!-- Subtitle Line 2 / Badges representation -->
    <text class="font-mono" x="600" y="255" text-anchor="middle" font-size="14" fill="#94a3b8">
      SaaS Category Leaders • Self-Hosted &amp; Local WebUIs • Enterprise Copilots • Open-Source
    </text>

    <!-- Terminal-like status pill in footer of banner -->
    <g transform="translate(600, 310)">
      <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="-160" cy="0" r="4" fill="#22c55e" />
      <text x="-145" y="4.5" fill="#64748b" class="font-mono" font-size="11.5">Updated October 2026 • Curated with Community</text>
    </g>
  </g>
</svg>
